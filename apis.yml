name: Haus Laboratories
description: >-
  Haus Labs by Lady Gaga (formerly Haus Laboratories) is an American clean-beauty cosmetics brand
  founded by Lady Gaga. It first launched in September 2019 and relaunched in June 2022 with Sephora
  as its exclusive retail partner. The brand makes skincare-infused, high-performance color cosmetics
  and makeup — including its Triclone Skin Tech Foundation plus lip, eye, and complexion products —
  that are always vegan and cruelty-free. It sells direct-to-consumer through hauslabs.com and through
  Sephora. Haus Labs is a consumer packaged goods / beauty company with no public developer API; this
  profile is maintained in the API Evangelist network as a company record surfaced from the Lightspeed
  Venture Partners portfolio.
